services:
  - type: web
    name: ollama-secure
    runtime: docker
    plan: 4c-16g          # <-- THAY ĐỔI Ở ĐÂY (trước là 'scale')
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OLLAMA_API_KEY
        generateValue: true
      - key: PORT
        value: 10000
      - key: OLLAMA_HOST
        value: "0.0.0.0:11434"
      - key: OLLAMA_KEEP_ALIVE
        value: "24h"
    disk:
      name: ollama-models
      mountPath: /root/.ollama
      sizeGB: 50
