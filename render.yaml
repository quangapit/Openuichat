services:
  - type: web
    name: ollama-secure
    runtime: docker
    plan: 12c-24g          # 4 CPU, 16 GB RAM (đổi tùy nhu cầu)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OLLAMA_API_KEY
        generateValue: true   # Render tự tạo key ngẫu nhiên
      - key: PORT
        value: 10000
      - key: OLLAMA_HOST
        value: "0.0.0.0:11434"
      - key: OLLAMA_KEEP_ALIVE
        value: "24h"
    disk:
      name: ollama-models
      mountPath: /root/.ollama
      sizeGB: 50
